<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="css/welcome.css" />
    <script src="scripts/jquery-3.3.1.min.js"></script>

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.css"
      rel="stylesheet"
    />
    <script src="scripts/semantic-2.4.1.min.js"></script>
  </head>

  <body>
    <div class="ui grid container">
      <div class="sixteen wide center aligned column">
        <br />
        <p class="caption" style="font-size: 9em">Leet<span style="color: #ff6c0a">Hub</span> v2</p>
        <p class="caption">Automatically sync your code from LeetCode to GitHub</p>
        <br /><br /><br /><br /><br /><br /><br /><br />
        <p hidden id="error"></p>
        <p hidden id="success"></p>
        <p hidden id="unlink">Linked the wrong repo? <a>Unlink</a>.</p>
      </div>

      <!-- Connect Hook Form -->
      <div style="display: none" id="hook_mode" class="ui grid container">
        <div class="sixteen wide column">
          <p class="caption ui large header center aligned">Connect LeetHub to GitHub</p>
        </div>
        <div class="eight wide column">
          <div class="ui form">
            <div class="field">
              <label style="color: #bfc0b9">GitHub Personal Access Token</label>
              <input
                autocomplete="off"
                id="pat_input"
                placeholder="Personal Access Token (ghp_... or fine-grained)"
                type="password"
              />
            </div>
          </div>
        </div>
        <div class="eight wide column">
          <div class="ui form">
            <div class="field">
              <label style="color: #bfc0b9">GitHub Repository</label>
              <input
                autocomplete="off"
                id="name"
                placeholder="Repository Name (e.g. LeetCode or owner/LeetCode)"
                type="text"
              />
            </div>
          </div>
        </div>

        <div class="sixteen wide center aligned column">
          <br />
          <button id="hook_button" class="positive ui large button">Connect Repository</button>
        </div>
      </div>

      <!-- Show stats & failover sync controls -->
      <div style="display: none" id="commit_mode" class="ui grid container">
        <div class="sixteen wide center aligned column">
          <br />
          <div style="font-size: 1.4em; color: white" class="ui header">
            Connected Repository: <span id="repo_url"></span>
          </div>
        </div>
        <div class="sixteen wide center aligned column">
          <div style="font-size: 2.3em" class="ui inverted large header">
            Problems Solved: <span id="p_solved">0</span>
          </div>
          <div style="font-size: 1.8em" class="ui inverted large header">
            <span style="color: #5cb85c">Easy: </span>
            <span id="p_solved_easy" style="color: #5cb85c">0 </span>
            <span style="color: #f0ad4e">&ensp; &ensp; Medium: </span>
            <span id="p_solved_medium" style="color: #f0ad4e">0 </span>
            <span style="color: #d9534f">&ensp; &ensp; Hard: </span>
            <span id="p_solved_hard" style="color: #d9534f">0 </span>
          </div>
          <br />
          <div style="margin-top: 10px">
            <button id="sync_config" class="ui small primary button" type="button">
              <i class="icon sync"></i> Sync Config
            </button>
            &ensp;
            <button id="sync_counts" class="ui small positive button" type="button">
              <i class="icon sync"></i> Sync Stats
            </button>
          </div>
          <div style="margin-top: 12px; color: #5cb85c; font-size: 0.95em" id="sync_status"></div>
        </div>
        <div class="sixteen wide center aligned column">
          <br />
          <div class="ui inverted small header">
            Want more features?
            <a
              style="color: aqua !important"
              target="_blank"
              href="https://github.com/vpk-11/LeetHub-2.0/labels/feature"
              >Request a feature!</a
            >
          </div>
        </div>
      </div>

      <!-- Rate on GitHub -->
      <div class="sixteen wide right aligned column">
        <br /><br /><br /><br /><br />
        <div class="ui inverted small header">
          <a
            style="color: rgb(143, 202, 202) !important"
            target="_blank"
            href="https://github.com/vpk-11/LeetHub-2.0"
            >Star <span style="color: white">Leet</span
            ><span style="color: #ff6c0a !important">Hub</span> on GitHub</a
          >
        </div>
      </div>
    </div>

    <script type="text/javascript" src="scripts/welcome.js"></script>
  </body>
</html>
